name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Icarus Verilog (RTL parity test)
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest
      - run: uv run ruff check pioscope
      - run: uv run mypy
