# RP2040 PIO: the instruction set of the Raspberry Pi RP2040's programmable I/O block,
# as an ISA pack (ADR-0012). Single source of truth for the pio pack.
#
# Syntax follows pioasm (the Pico SDK assembler) for the nine instructions, side-set
# and delay. The binary encoding is the exact RP2040 16-bit format, produced by the
# pack's encoder (piolab/packs/pio/encode.py), so words match pioasm output.
#
# The engine model (piolab/packs/pio/models/base/) implements the semantics below for one state machine
# (SM) of a PIO block. Things the Pico SDK configures from C (pin bases, shift
# directions, autopush/autopull, FIFO join, clock divider) are harness directives here:
# `.pins`, `.sm_config` and `.clkdiv`. pioasm does not have them (see `harness: true`).
#
# Operand type kinds understood by the loader:
#   int      integer literal (dec, 0x, 0b, k/M suffix) or a parenthesised expression;
#            min/max; bits for encoding; bias
#   label    program label, resolved to an imem address
#   cond     a name from `conditions:`
#   enum     one of `values` (matched case-insensitively); `codes` = encoding of each
#   flag     a bare keyword whose presence means true
#   pattern  regex over the item text; `fields` lists named groups and their allowed
#            values (first = default); `codes` gives each field's encodings
#   word     any identifier
#   rest     all remaining items, as a list of strings (directives only)

version: 1.0.0
name: RP2040 PIO
pack: pio

hooks:
  directives: piolab.packs.pio.directives   # .side_set (5-bit delay/side field), .sm_config
  encoder: piolab.packs.pio.encode          # the RP2040 16-bit instruction format

params:
  imem_size: 32          # instruction memory shared by the block's four SMs
  word_bits: 16
  delay_max: 31          # without side-set; each side-set bit (and opt) halves it
  side_max: 5            # bits of the shared delay/side-set field
  fifo_depth: 4          # per direction; 8 when joined
  fifo_bits: 32          # FIFO entries are 32-bit words
  sm_count: 4            # state machines per block (the model runs SM0 per program)
  irq_flags: 8           # block IRQ flags; 0-3 are visible to the host
  sysclk_hz: 50000000    # the bench's clock (Tiny Tapeout tile); an RP2040 runs at 125 MHz

# The pads the SM's GPIOs are mapped to (Tiny Tapeout tile pinout). The model numbers
# them as GPIOs: ui0-7 = GPIO 0-7, uo0-7 = GPIO 8-15, uio0-7 = GPIO 16-23.
target:
  name: tinytapeout
  pads:
    ui:  {count: 8, dir: in}
    uo:  {count: 8, dir: out}
    uio: {count: 8, dir: bidir}
  pin_modes: [push_pull, open_drain]

operand_types:
  label:      {kind: label}
  cond:       {kind: cond}
  count32:    {kind: int, min: 1, max: 32}   # 5 bits; the encoder writes 32 as 0
  imm5:       {kind: int, min: 0, max: 31, bits: 5}
  idx5:       {kind: int, min: 0, max: 31, bits: 5}
  irq_n:      {kind: int, min: 0, max: 7, bits: 3}
  pol:        {kind: enum, values: ["0", "1"], codes: [0, 1]}
  wait_src:   {kind: enum, values: [gpio, pin, irq], codes: [0, 1, 2]}
  in_src:     {kind: enum, values: [pins, x, y, "null", isr, osr], codes: [0, 1, 2, 3, 6, 7]}
  out_dst:
    kind: enum
    values: [pins, x, y, "null", pindirs, pc, isr, exec]
    codes:  [0, 1, 2, 3, 4, 5, 6, 7]
  set_dst:    {kind: enum, values: [pins, x, y, pindirs], codes: [0, 1, 2, 4]}
  mov_dst:    {kind: enum, values: [pins, x, y, exec, pc, isr, osr], codes: [0, 1, 2, 4, 5, 6, 7]}
  mov_src:
    kind: pattern
    regex: '^(?P<op>~|!|::)?(?P<src>pins|x|y|null|status|isr|osr)$'
    fields:
      op:  [none, "!", "~", "::"]
      src: [pins, x, y, "null", status, isr, osr]
    codes:
      op:  [0, 1, 1, 2]
      src: [0, 1, 2, 3, 5, 6, 7]
  blocking:   {kind: enum, values: [block, noblock], codes: [1, 0]}
  irq_op:     {kind: enum, values: [set, nowait, wait, clear], codes: [0, 0, 1, 2]}  # bits 6:5
  name:       {kind: word}
  pin_map:
    kind: pattern
    regex: '^(?P<pad>(?:ui|uo|uio)[0-7])(?:/(?P<mode>push_pull|open_drain))?$'
    fields:
      pad: []
      mode: [push_pull, open_drain]
  pin_ref:    # a .pins role name or a GPIO number
    kind: pattern
    regex: '^(?P<pin>[A-Za-z_]\w*|\d+)$'
  pin_set:    # role|role|... or GPIO numbers
    kind: pattern
    regex: '^(?P<pins>[A-Za-z_0-9]+(?:\|[A-Za-z_0-9]+)*)$'
  pin_range:  # base[:count]
    kind: pattern
    regex: '^(?P<pin>[A-Za-z_]\w*|\d+)(?::(?P<count>\d+))?$'
    ints: [count]
  shift_dir:  {kind: enum, values: [right, left]}
  thresh:     {kind: int, min: 1, max: 32}
  fifo_join:  {kind: enum, values: [none, tx, rx]}
  status_sel:
    kind: pattern
    regex: '^(?P<fifo>tx|rx)<(?P<n>\d+)$'
    ints: [n]
  clkdiv:
    kind: pattern
    regex: '^(?P<int>\d+)(?:\.(?P<frac>\d+))?$'
    ints: [int]
  side_opt:   {kind: flag, word: opt}
  side_pindirs: {kind: flag, word: pindirs}
  side_count: {kind: int, min: 0, max: 5}
  rest:       {kind: rest}

# Encoded in this order as the 3-bit jmp condition.
conditions:
  - {name: always,   semantics: "Always (no condition written)."}
  - {name: "!x",     semantics: "X is zero."}
  - {name: "x--",    semantics: "X is non-zero before the decrement; X is decremented either way."}
  - {name: "!y",     semantics: "Y is zero."}
  - {name: "y--",    semantics: "Y is non-zero before the decrement; Y is decremented either way."}
  - {name: "x!=y",   semantics: "X differs from Y."}
  - {name: pin,      semantics: "The SM's jump pin (`.sm_config jmp=`) is high."}
  - {name: "!osre",  semantics: "OSR is not empty: its shift count is below the pull threshold."}

# The RP2040 format. The 5-bit delay_side field holds the side-set bits (MSB first,
# with an enable bit on top when `.side_set ... opt`) and the delay in the rest.
encoding:
  strict: true
  fields:            # MSB → LSB
    opcode:     3
    delay_side: 5
    operand:    8
  roles:
    opcode: "the major opcode (`push` and `pull` share 4, told apart by bit 7; `nop` is `mov y, y`)"
    delay_side: "side-set bits (MSB first, under an enable bit with `.side_set n opt`), then the `[n]` delay in the bits left"
    operand: "the instruction's arguments"
  notes:
    - "This is the RP2040 format, so it is fixed: words match pioasm (tests: piolab/packs/pio/tests/test_encode.py)."
    - "An instruction memory of 32 words is shared by the block's four state machines; `jmp` targets are 5-bit absolute addresses."

instructions:
  - name: jmp
    tier: 1
    opcode: 0
    operands:
      - {name: cond, type: cond, optional: true, default: always}
      - {name: target, type: label}
    semantics: "If cond is true, set the PC to target; otherwise continue. x--/y-- decrement the register even when the jump is not taken."
  - name: wait
    tier: 1
    opcode: 1
    operands:
      - {name: pol, type: pol}
      - {name: src, type: wait_src}
      - {name: idx, type: idx5}
      - {name: rel, type: flag, optional: true, default: false}
    semantics: "Stall until the source equals pol: gpio = absolute GPIO idx, pin = input pin idx (relative to the in base), irq = IRQ flag idx (0-7; rel adds the SM number modulo 4). A satisfied `wait 1 irq` clears the flag."
  - name: in
    tier: 1
    opcode: 2
    operands:
      - {name: src, type: in_src}
      - {name: count, type: count32}
    semantics: "Shift count bits from src into ISR (direction from `.sm_config in_shift=`) and add count to the input shift count (saturating at 32). With autopush, push ISR when the count reaches the threshold, stalling while the RX FIFO is full."
  - name: out
    tier: 1
    opcode: 3
    operands:
      - {name: dst, type: out_dst}
      - {name: count, type: count32}
    semantics: "Shift count bits out of OSR (direction from `.sm_config out_shift=`) to dst and add count to the output shift count. pc jumps; exec runs the data as an instruction next cycle. With autopull, refill OSR from the TX FIFO when the count reaches the threshold, stalling while it is empty."
  - name: push
    tier: 1
    opcode: 4
    operands:
      - {name: iffull, type: flag, optional: true, default: false}
      - {name: mode, type: blocking, optional: true, default: block}
    semantics: "Push ISR to the RX FIFO and clear it. iffull: do nothing unless the input count has reached the push threshold. block (default): stall while the FIFO is full; noblock: drop the data instead."
  - name: pull
    tier: 1
    opcode: 4
    operands:
      - {name: ifempty, type: flag, optional: true, default: false}
      - {name: mode, type: blocking, optional: true, default: block}
    semantics: "Load OSR from the TX FIFO. ifempty: do nothing unless the output count has reached the pull threshold. block (default): stall while the FIFO is empty; noblock: copy X into OSR instead. With autopull on, a pull is a no-op while OSR is full."
  - name: mov
    tier: 1
    opcode: 5
    operands:
      - {name: dst, type: mov_dst}
      - {name: src, type: mov_src}
    semantics: "dst = op(src). op: ! or ~ inverts, :: bit-reverses. status is all ones while the selected FIFO's level is below N (`.sm_config status=`), else zero. mov isr/osr reset the matching shift count; exec runs the value as an instruction next cycle."
  - name: irq
    tier: 1
    opcode: 6
    operands:
      - {name: op, type: irq_op, optional: true, default: set}
      - {name: n, type: irq_n}
      - {name: rel, type: flag, optional: true, default: false}
    semantics: "set / nowait: raise IRQ flag n. wait: raise it, then stall until something clears it. clear: lower it. rel adds the SM number modulo 4 to n's low two bits."
  - name: set
    tier: 1
    opcode: 7
    operands:
      - {name: dst, type: set_dst}
      - {name: value, type: imm5}
    semantics: "Write a 5-bit immediate to X or Y (zero-extended), or to the SM's set pins / their directions."
  - name: nop
    tier: 1
    opcode: 5
    operands: []
    semantics: "Assembles to `mov y, y`: no effect beyond side-set and delay."

# Every instruction takes `side <v>` and `[delay]`.
default_modifiers: [side, delay]

directives:
  - name: .program
    operands:
      - {name: name, type: name}
    semantics: "Start of a program. One per source file (tool limitation; pioasm allows several)."
  - name: .side_set
    operands:
      - {name: count, type: side_count}
      - {name: opt, type: side_opt, optional: true, default: false}
      - {name: pindirs, type: side_pindirs, optional: true, default: false}
    semantics: "Side-set width in bits. opt makes it optional per instruction (costs an enable bit); pindirs side-sets pin directions instead of levels. Side-set and opt bits come out of the 5-bit delay field."
  - name: .wrap_target
    operands: []
    semantics: "Address the program wraps back to."
  - name: .wrap
    operands: []
    semantics: "After the preceding instruction, continue at .wrap_target at no cost."
  - name: .define
    operands:
      - {name: name, type: name}
      - {name: value, type: rest}
    semantics: "Textual constant substituted for later operand items and inside expressions."
  - name: .pins
    harness: true
    operands:
      - {name: map, type: rest}
    semantics: "Harness: name the pads the SM uses, `.pins tx=uo0 sda=uio1/open_drain`. A pad is GPIO ui0-7 = 0-7, uo0-7 = 8-15, uio0-7 = 16-23. An output role starts as an output (pindir 1) unless open_drain."
  - name: .sm_config
    harness: true
    operands:
      - {name: out, type: pin_range, key: out, optional: true, default: null}
      - {name: set, type: pin_range, key: set, optional: true, default: null}
      - {name: in, type: pin_ref, key: in, optional: true, default: null}
      - {name: sideset, type: pin_ref, key: sideset, optional: true, default: null}
      - {name: jmp, type: pin_ref, key: jmp, optional: true, default: null}
      - {name: out_shift, type: shift_dir, key: out_shift, optional: true, default: right}
      - {name: in_shift, type: shift_dir, key: in_shift, optional: true, default: right}
      - {name: autopull, type: thresh, key: autopull, optional: true, default: null}
      - {name: pull_thresh, type: thresh, key: pull_thresh, optional: true, default: null}
      - {name: autopush, type: thresh, key: autopush, optional: true, default: null}
      - {name: push_thresh, type: thresh, key: push_thresh, optional: true, default: null}
      - {name: fifo, type: fifo_join, key: fifo, optional: true, default: none}
      - {name: status, type: status_sel, key: status, optional: true, default: null}
      - {name: high, type: pin_set, key: high, optional: true, default: null}
    semantics: "Harness: the SM configuration the Pico SDK sets from C (sm_config_set_*, and the pin init before the SM starts). Pins are .pins roles or GPIO numbers: out=base[:count] (default 0:32), set=base[:count] (default 0:5), in=, sideset=, jmp=. Shifts default to right. autopull=N / autopush=N turn on autopull / autopush at threshold N; pull_thresh= / push_thresh= set the threshold alone (default 32). fifo=tx|rx joins both FIFOs into one of depth 8. status=tx<N|rx<N selects mov status. high=a|b sets those pins' output level to 1 at reset (e.g. a UART line or a CPOL=1 clock idling high)."
  - name: .clkdiv
    harness: true
    operands:
      - {name: div, type: clkdiv}
    semantics: "Harness: the SM clock divider, int[.frac] with 1 <= int <= 65535 and the fraction in 1/256 steps. Default 1 (every sysclk)."
