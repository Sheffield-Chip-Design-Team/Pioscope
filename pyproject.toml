[project]
name = "piolab"
version = "0.3.0"
description = "PIOLab: ISA-pack assembler, engine models, verification bench and debugger (pre-RTL)"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pyvcd>=0.4",
    "cocotb==2.0.1",
]

[project.scripts]
piolab = "piolab.cli:main"

[project.entry-points.pytest11]
piolab = "piolab.testing"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["piolab"]

[tool.pytest.ini_options]
testpaths = ["piolab/tests", "piolab/packs"]
addopts = "-ra"
markers = [
    "requires_engine: needs a real engine DUT (model or RTL); skipped on the stub",
    "rtl: runs on an HDL simulator through cocotb",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["piolab"]

[[tool.mypy.overrides]]
module = ["vcd.*", "cocotb.*", "cocotb_tools.*"]
ignore_missing_imports = true
